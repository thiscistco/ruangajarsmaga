name: Android Guru
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 (runner toolchain)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /tmp/android-setup.log 2>&1 || { echo "::error::$(tail -n 12 /tmp/android-setup.log | tr '\n' ' ')"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and debug APK (no production credentials)
        working-directory: android
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug > /tmp/android-build.log 2>&1 || { echo "::error::$(tail -n 35 /tmp/android-build.log | tr '\n' ' ')"; exit 1; }
          tail -n 15 /tmp/android-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ruangajar-guru-debug-unconfigured
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
