<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>RuangAjar — Preview Login Web</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#faf9f5;color:#252723;--card:#fff;--border:#dedfd8;--muted:#64675f;--field:#fff;--focus:#786000}body.dark{background:#181a17;color:#f5f5ee;--card:#242721;--border:#50554b;--muted:#bfc4b8;--field:#2c3029;--focus:#ffda3b}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}.top{display:flex;justify-content:flex-end;padding:20px 24px}.theme{border:1px solid var(--border);border-radius:24px;padding:10px 16px;background:var(--card);color:inherit;min-height:44px}main{min-height:calc(100svh - 86px);display:grid;place-items:center;padding:24px 20px 72px}.card{width:100%;max-width:390px;padding:34px 30px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 48px #00000005;text-align:center}.mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 12px;background:#ffda3b;border-radius:14px;color:#252723}.mark svg{width:28px;height:28px}h1{font-size:26px;letter-spacing:-.8px;margin:0}h2{font-size:16px;font-weight:500;color:var(--muted);margin:8px 0 28px}form{display:grid;gap:14px}.field{display:flex;align-items:center;min-width:0;border:1px solid var(--border);border-radius:10px;background:var(--field);padding-left:14px;color:var(--muted)}.field:focus-within{outline:2px solid var(--focus);outline-offset:2px}.field svg{width:19px;height:19px;flex-shrink:0}input{min-width:0;width:100%;padding:14px 12px;border:0;border-radius:10px;background:transparent;color:inherit;outline:none!important}input::placeholder{color:var(--muted)}.eye{display:grid;place-items:center;flex-shrink:0;width:46px;min-height:48px;border:0;border-radius:9px;background:transparent;color:inherit}.submit{border:0;border-radius:10px;background:#ffda3b;color:#252723;font-weight:700;min-height:49px;margin-top:6px}.help{border:0;background:none;color:var(--muted);padding:12px;min-height:44px;margin-top:12px;font-size:13px}.note{font-size:12px;color:var(--muted);margin:24px 0 0}.status{font-size:13px;text-align:left;color:var(--muted);margin:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{width:min(400px,calc(100% - 32px));border:1px solid var(--border);border-radius:16px;padding:24px;background:var(--card);color:inherit}dialog::backdrop{background:#0008}dialog h2{color:inherit;margin-top:0}dialog p{color:var(--muted)}dialog button{width:100%}@media(max-width:440px){.top{padding:16px}main{padding:12px 16px 32px}.card{padding:28px 22px}}@media(max-height:550px) and (orientation:landscape){.top{padding:12px 20px}main{min-height:0;padding:0 20px 24px}.card{padding:22px 28px}h2{margin-bottom:18px}.note{margin-top:12px}}
</style></head><body>
<header class="top"><button class="theme" id="theme" type="button" aria-pressed="false">☾ Dark Mode</button></header>
<main><section class="card" aria-labelledby="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/></svg></div><h1 id="brand">RuangAjar</h1><h2>Masuk</h2>
<form id="login"><label class="field"><span class="sr">Email akun</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 6 9 7 9-7"/></svg><input aria-label="Email akun contoh" type="email" value="pengguna@contoh.invalid" readonly autocomplete="off"></label>
<div class="field"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><label class="sr" for="password">Kata sandi</label><input id="password" type="password" value="ContohSaja" readonly autocomplete="off"><button class="eye" id="eye" type="button" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="submit" type="submit">Masuk</button><p class="status" id="status" role="status"></p></form>
<button class="help" id="help" type="button">Hubungi admin</button><p class="note">Preview desain · Login simulasi</p></section></main>
<dialog id="dialog" aria-labelledby="help-title"><h2 id="help-title">Hubungi admin sekolah</h2><p>Akun admin, guru, dan siswa dikelola oleh sekolah. Hubungi admin sekolah jika membutuhkan akun atau bantuan kata sandi.</p><button class="submit" id="close" type="button">Mengerti</button></dialog>
<script>
const theme=document.querySelector('#theme'),password=document.querySelector('#password'),eye=document.querySelector('#eye'),dialog=document.querySelector('#dialog');
function setTheme(dark){document.body.classList.toggle('dark',dark);theme.textContent=dark?'☀ Light Mode':'☾ Dark Mode';theme.setAttribute('aria-pressed',String(dark));}
try{setTheme(localStorage.getItem('ruangajar.web.preview.dark')==='true')}catch{}
theme.onclick=()=>{const dark=!document.body.classList.contains('dark');setTheme(dark);try{localStorage.setItem('ruangajar.web.preview.dark',String(dark))}catch{}};
eye.onclick=()=>{const visible=password.type==='password';password.type=visible?'text':'password';eye.setAttribute('aria-label',visible?'Sembunyikan kata sandi':'Tampilkan kata sandi');eye.setAttribute('aria-pressed',String(visible))};
document.querySelector('#login').onsubmit=e=>{e.preventDefault();document.querySelector('#status').textContent='Ini simulasi desain. Pada login asli, akses mengikuti peran akun yang diverifikasi server.'};
document.querySelector('#help').onclick=()=>dialog.showModal();document.querySelector('#close').onclick=()=>dialog.close();
</script></body></html>
