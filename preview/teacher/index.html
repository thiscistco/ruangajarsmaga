*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text);--bg:#fcf9ef;--card:#fffefa;--text:#292a25;--muted:#6b6c63;--line:#e8e5db;--soft:#fff6da;--gold:#ffda3b}body.dark{--bg:#191c18;--card:#242820;--text:#f4f4ed;--muted:#bfc4b5;--line:#41483a;--soft:#363421;color-scheme:dark}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a58200;outline-offset:3px}button{border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:44px;padding:9px 14px}button:hover{background:var(--soft)}aside{position:fixed;width:250px;inset:0 auto 0 0;background:var(--card);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;z-index:3}.brand{font-size:26px;font-weight:750;letter-spacing:-1px;display:flex;align-items:center;gap:12px}.brand b{color:#a17c00}.brand small{display:block;font-size:14px;font-weight:400;color:var(--muted);letter-spacing:0}.logo{background:var(--gold);color:#292a25;padding:9px;border-radius:14px;font-size:26px}nav{display:grid;gap:10px;border-top:1px solid var(--line);margin-top:28px;padding-top:24px}nav button{text-align:left;border:0;display:flex;gap:14px;align-items:center}nav button.active{background:var(--soft);font-weight:700}aside .bottom{margin-top:auto}main{margin-left:250px;padding:32px 38px;max-width:1700px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}h1{font-size:clamp(23px,2.5vw,32px);line-height:1.2;margin:0 0 8px}h2{font-size:22px;margin:0}p{margin:0;color:var(--muted)}.tools{display:flex;gap:12px;align-items:center}.icon{width:46px;padding:9px;font-size:20px;flex-shrink:0}.clock{white-space:nowrap;font-size:20px;font-weight:700;padding:10px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.banner{font-size:12px;margin-bottom:18px;color:var gn:center}.compact aside{width:84px;padding-inline:12px}.compact aside .label{display:none}.compact .brand{justify-content:center}.compact main{margin-left:84px}.compact nav button{justify-content:center}.compact aside .bottom{padding-inline:0}dialog{width:min(480px,calc(100% - 32px));max-height:88svh;overflow:auto;border:1px solid var(--line);border-radius:20px;padding:24px;background:var(--card);color:var(--text)}dialog::backdrop{background:#0007}dialog .heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}dialog form{display:grid;gap:14px}label{display:grid;gap:5px}input,textarea,select{min-width:0;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}textarea{min-height:90px;resize:vertical}.primary{background:var(--gold);color:#292a25;font-weight:650}.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}.danger{color:#bd3844}.mobile{display:none}#notice{color:var(--muted);font-size:13px;margin:16px 0}.closeOverlay{display:none}@media(max-width:1050px){main{padding:24px}.columns{grid-template-columns:1fr}.top{align-items:flex-start}.clock{font-size:17px;padding:11px}}@media(max-width:700px){aside{transform:translateX(-100%);width:250px!important}.open aside{transform:none}.open .closeOverlay{display:block;position:fixed;inset:0;background:#0006;border:0;border-radius:0;z-index:2;width:100%}main,.compact main{margin-left:0;padding:20px 14px}.compact aside .label{display:initial}.compact nav button{justify-content:flex-start}.mobile{display:block}.top{flex-wrap:wrap;gap:12px}.tools{width:100%;justify-content:space-between}.day{min-height:67px}.day strong{font-size:21px}.day span{font-size:11px}.head{padding:16px}.head h2{font-size:19px}.calgrid{padding:8px;gap:2px}.body{padding:16px}.schedule{gap:12px;padding:14px}.schedule div{padding-left:12px}.schedule time{font-size:13px}.summary{gap:10px}.summary button{min-width:0;flex:1;padding:12px;gap:10px}.summary small{fo </style></head><body><button class="closeOverlay" id="overlay" aria-label="Tutup menu"></button><aside><div class="brand"><span class="logo">♧</span><div class="label">Ruang<b>Ajar</b><small>Portal Guru</small></div></div><nav><button class="active" data-page="home" title="Beranda"><span>⌂</span><span class="label">Beranda</span></button><button data-page="classes" title="Kelas Saya"><span>▤</span><span class="label">Kelas Saya</span></button><button data-page="schedule" title="Jadwal Mengajar"><span>▦</span><span class="label">Jadwal Mengajar</span></button><button data-page="notes" title="Agenda & Catatan"><span>▣</span><span class="label">Agenda & Catatan</span></button></nav><button id="collapse" class="bottom" aria-label="Ciutkan sidebar" aria-expanded="true">⇤ <span class="label">Ciutkan menu</span></button></aside><main><div class="top"><div><h1 id="greeting">Selamat datang, Bapak/Ibu Guru</h1><p id="todayLabel"></p></div><div class="tools"><button class="icon mobile" id="menu" aria-label="Buka menu" aria-expanded="false">☰</button><span class="clock" id="clock"></span><button class="icon" id="theme" aria-label="Aktifkan mode gelap"><span aria-hidden="true">☾</span></button></div></div><p class="banner">PREVIEW INTERAKTIF · Data contoh, bukan akun asli · Perubahan simulasi hilang saat halaman dimuat ulang</p><section class="card calendar"><div class="head"><button id="expand" aria-expanded="false" aria-controls="calendar"><strong id="month"></strong> <span id="chevron">⌄</span></button><div><button id="previous" class="icon" aria-label="Minggu sebelumnya">‹</button> <button id="next" class="icon" aria-label="Minggu berikutnya">›</button></div></div><div id="calendar" class="calgrid"></div></section><div class="columns"><section class="card"><div class="head"><div><h2 id="sectionTitle">Jadwal Mengajar</h2><p id="selectedLabel"></p></div><button id="manage">Kelola jadwal ›</button></div><div class="body" id="schedules"></div></section><section class="card"><div class="head"><h2>Agenda & Catatan</h2><button class="icon" id="add" aria-label="Tambah agenda atau catatan">＋</button></div><div class="body" id="entries"></div></section></div><div class="summary"><button id="classes"><span class="badge">▤</span><span><strong>2</strong><small>Kelas diampu</small></span></button><button id="subjects"><span class="badge">◇</span><span><strong>1</strong><small>Mata pelajaran</small></span></button></div><p id="notice" role="status"></p></main><dialog id="dialog"><div class="heading"><h2 id="dialogTitle"></h2><button class="icon" id="close" aria-label="Tutup dialog">×</button></div><div id="dialogBody"></div></dialog><script>
const $=s=>document.querySelector(s), dateKey=d=>d.toISOString().slice(0,10), fromKey=k=>new Date(k+'T12:00:00Z'), addDays=(d,n)=>new Date(d.getTime()+n*86400000);
const todayKey=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const today=fromKey(todayKey);let selected=new Date(today),expanded=false,page='home',id=3;
let entries=[{id:1,type:'Agenda',date:todayKey,time:'13:00',title:'Rapat guru',body:'Koordinasi kegiatan sekolah'},{id:2,type:'Catatan',date:todayKey,time:'',title:'Siapkan latihan persamaan kuadrat',body:'Catatan pribadi untuk persiapan kelas.'}];
let schedules=[{id:1,day:today.getUTCDay(),start:'07:00',end:'08:30',className:'XI-1',room:'201'},{id:2,day:today.getUTCDay(),start:'10:00',end:'11:30',className:'XI-2',room:'202'}];
const weekdays=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];const fullDate=d=>new Intl.DateTimeFormat('id-ID',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
function clock(){const now=new Date();$('#clock').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now)+' WIB';$('#todayLabel').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',hourCycle:'h23'}).format(now));$('#greeting').textContent=`Selamat ${hour<11?'pagi':hour<15?'siang':hour<18?'sore':'malam'}, Bapak/Ibu Guru`;}
clock();setInterval(clock,1000);
function theme(dark){document.body.classList.toggle('dark',dark);$('#theme span').textContent=dark?'☀':'☾';$('#theme').setAttribute('aria-label',dark?'Aktifkan mode terang':'Aktifkan mode gelap')}
try{theme(localStorage.getItem('ruangajar.teacher.preview.dark')==='true')}catch{}
$('#theme').onclick=()=>{const dark=!document.body.classList.contains('dark');theme(dark);try{localStorage.setItem('ruangajar.teacher.preview.dark',String(dark))}catch{}};
function button(text,action,cls){const b=document.createElement('button');b.textContent=text;if(cls)b.className=cls;b.onclick=action;return b}
function render(){
 $('#month').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'UTC',month:'long',year:'numeric'}).format(selected);$('#selectedLabel').textContent=fullDate(selected);$('#expand').setAttribute('aria-expanded',String(expanded));$('#chevron').textContent=expanded?'⌃':'⌄';$('#previous').setAttribute('aria-label',expanded?'Bulan sebelumnya':'Minggu sebelumnya');$('#next').setAttribute('aria-label',expanded?'Bulan berikutnya':'Minggu berikutnya');
 let start=expanded?new Date(Date.UTC(selected.getUTCFullYear(),selected.getUTCMonth(),1,12)):selected;start=addDays(start,-((start.getUTCDay()+6)%7));const grid=$('#calendar');grid.replaceChildren();const days=expanded?Math.ceil((((new Date(Date.UTC(selected.getUTCFullYear(),selected.getUTCMonth(),1)).getUTCDay()+6)%7)+new Date(Date.UTC(selected.getUTCFullYear(),selected.getUTCMonth()+1,0)).getUTCDate())/7)*7:7;
 for(let n=0;n<days;n++){const d=addDays(start,n),key=dateKey(d),has=entries.some(e=>e.date===key);const b=button('',()=>{selected=d;render()},'day'+(key===dateKey(selected)?' selected':'')+(key===todayKey?' today':'')+(d.getUTCMonth()!==selected.getUTCMonth()?' out':''));b.setAttribute('aria-label',fullDate(d)+(expanded&&has?', ada agenda atau catatan':''));b.setAttribute('aria-pressed',String(key===dateKey(selected)));if(key===todayKey)b.setAttribute('aria-current','date');b.innerHTML='<span>'+weekdays[d.getUTCDay()]+'</span><strong>'+d.getUTCDate()+'</strong>'+(expanded&&has?'<div class="dot"></div>':'');grid.append(b)}
 const list=$('#schedules');list.replaceChildren();$('#sectionTitle').textContent=page==='classes'?'Kelas Saya':page==='schedule'?'Jadwal Mingguan':'Jadwal Mengajar';
 if(page==='classes'){for(const c of ['XI-1','XI-2'])list.append(button(c+' · Matematika',()=>info('Kelas '+c,'Contoh penugasan Matematika. Daftar siswa asli belum dihubungkan.'),'schedule'));}
 else{const filtered=schedules.filter(s=>page==='schedule'||s.day===selected.getUTCDay()).sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start));for(const s of filtered){const b=button('',()=>scheduleForm(s),'schedule');const t=document.createElement('time');t.textContent=s.start+'–'+s.end;const box=document.createElement('div');const title=document.createElement('strong');title.textContent='Matematika';const sub=document.createElement('small');sub.textContent=(page==='schedule'?weekdays[s.day]+' · ':'')+s.className+' · Ruang '+(s.room||'—');box.append(title,sub);b.append(t,box);list.append(b)}if(!filtered.length){const p=document.createElement('p');p.className='empty';p.textContent='Tidak ada jadwal mengajar pada tanggal ini.';list.append(p)}}
 const entryList=$('#entries');entryList.replaceChildren();for(const e of entries.filter(e=>e.date===dateKey(selected)).sort((a,b)=>a.time.localeCompare(b.time))){const b=button('',()=>entryForm(e),'entry');const icon=document.createElement('span');icon.className='badge';icon.textContent=e.type==='Agenda'?'▦':'♧';const box=document.createElement('span'),title=document.createElement('strong'),sub=document.createElement('small');title.textContent=e.title;sub.textContent=e.type==='Agenda'?(e.time?e.time+' WIB':'Sepanjang hari'):'Catatan pribadi';box.append(title,sub);b.append(icon,box);entryList.append(b)}if(!entryList.childNodes.length){const p=document.createElement('p');p.className='empty';p.textContent='Belum ada agenda atau catatan.';entryList.append(p)}
}
$('#expand').onclick=()=>{expanded=!expanded;render()};function move(n){if(expanded)selected=new Date(Date.UTC(selected.getUTCFullYear(),selected.getUTCMonth()+n,1,12));else selected=addDays(selected,n*7);render()}$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
const dialog=$('#dialog');function openDialog(title){$('#dialogTitle').textContent=title;$('#dialogBody').replaceChildren();dialog.showModal();return $('#dialogBody')}$('#close').onclick=()=>dialog.close();function info(title,text){const box=openDialog(title),p=document.createElement('p');p.textContent=text;box.append(p)}
function field(form,label,name,type,value){const l=document.createElement('label');l.textContent=label;const input=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');if(!['textarea','select'].includes(type))input.type=type;input.name=name;if(type==='select'){for(const [val,text] of value){const o=document.createElement('option');o.value=val;o.textContent=text;input.append(o)}}else input.value=value||'';l.append(input);form.append(l);return input}
function removeButton(form,action){const b=button('Hapus',()=>{});b.textContent='Hapus';b.type='button';b.className='danger';b.onclick=()=>{if(confirm('Hapus data contoh ini?')){action();dialog.close();render()}};form.append(b)}
function entryForm(item){const box=openDialog(item?'Edit agenda / catatan':'Tambah agenda / catatan'),form=document.createElement('form');box.append(form);const type=field(form,'Jenis','type','select',[['Agenda','Agenda'],['Catatan','Catatan pribadi']]);type.value=item?.type||'Agenda';field(form,'Tanggal','date','date',item?.date||dateKey(selected)).required=true;field(form,'Judul','title','text',item?.title).required=true;field(form,'Jam (opsional)','time','time',item?.time);field(form,'Keterangan / isi catatan','body','textarea',item?.body);const save=button('Simpan simulasi',null,'primary');save.type='submit';form.append(save);if(item)removeButton(form,()=>entries=entries.filter(e=>e.id!==item.id));form.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(!data.title.trim())return;data.title=data.title.trim();if(item)Object.assign(item,data);else entries.push({...data,id:++id});selected=fromKey(data.date);dialog.close();render()};}
function scheduleForm(item){const box=openDialog(item?'Edit jadwal contoh':'Tambah jadwal contoh'),p=document.createElement('p');p.textContent='Simulasi pola mingguan saja. Masa berlaku, perubahan satu pertemuan, dan riwayat akan diterapkan pada integrasi data asli.';box.append(p);const form=document.createElement('form');box.append(form);field(form,'Kelas / mata pelajaran','className','select',[['XI-1','XI-1 · Matematika'],['XI-2','XI-2 · Matematika']]).value=item?.className||'XI-1';field(form,'Hari','day','select',[1,2,3,4,5,6,0].map(n=>[n,weekdays[n]])).value=item?.day??selected.getUTCDay();field(form,'Jam mulai','start','time',item?.start||'07:00').required=true;const end=field(form,'Jam selesai','end','time',item?.end||'08:30');end.required=true;form.oninput=()=>end.setCustomValidity('');field(form,'Ruang (opsional)','room','text',item?.room);const save=button('Simpan simulasi',null,'primary');save.type='submit';form.append(save);if(item)removeButton(form,()=>schedules=schedules.filter(s=>s.id!==item.id));form.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));data.day=Number(data.day);if(data.end<=data.start||schedules.some(s=>s.id!==item?.id&&s.day===data.day&&data.start<s.end&&data.end>s.start)){end.setCustomValidity('Periksa urutan jam atau bentrok dengan jadwal lainnya.');end.reportValidity();return}if(item)Object.assign(item,data);else schedules.push({...data,id:++id});dialog.close();render()};}
$('#add').onclick=()=>entryForm();$('#manage').onclick=()=>scheduleForm();$('#classes').onclick=()=>navigate('classes');$('#subjects').onclick=()=>info('Mata pelajaran','Matematika · XI-1 dan XI-2. Ini contoh penugasan, bukan data asli.');
function navigate(next){page=next;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));closeMenu();render();if(next==='notes')$('#entries').scrollIntoView({behavior:'smooth',block:'center'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));function closeMenu(){document.body.classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}$('#menu').onclick=()=>{document.body.classList.add('open');$('#menu').setAttribute('aria-expanded','true')};$('#overlay').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});$('#collapse').onclick=()=>{if(innerWidth<=700){closeMenu();return}const compact=document.body.classList.toggle('compact');$('#collapse').setAttribute('aria-expanded',String(!compact));$('#collapse').setAttribute('aria-label',compact?'Perluas sidebar':'Ciutkan sidebar')};render();
</script></body></html>
